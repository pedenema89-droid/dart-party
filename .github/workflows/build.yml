
name: Build Dart Party Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Flutter installieren
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Projekt entpacken
        run: |
          set -euo pipefail
          mkdir -p app
          ZIP_FILE="dart-party-upload-fixed.zip"
          test -f "$ZIP_FILE" || { echo "Datei $ZIP_FILE fehlt im Repository-Root."; exit 1; }
          unzip -q "$ZIP_FILE" -d app
          test -f app/dart_party_android/pubspec.yaml

      - name: Android-Projekt erzeugen
        working-directory: app/dart_party_android
        run: flutter create --project-name dart_party --platforms android .

      - name: Release-Keystore einrichten
        working-directory: app/dart_party_android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/dart-party-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          export RELEASE_KEYSTORE="$KEYSTORE"
          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path("android/app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")

          if 'signingConfigs.create("release")' in text:
              raise SystemExit("Release-Signierung ist bereits eingerichtet.")

          signing = """
              signingConfigs {
                  create("release") {
                      storeFile = file(System.getenv("RELEASE_KEYSTORE"))
                      storePassword = System.getenv("ANDROID_STORE_PASSWORD")
                      keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          """

          marker = "    buildTypes {"
          if marker not in text:
              raise SystemExit("buildTypes-Block nicht gefunden.")

          text = text.replace(marker, signing + "\n" + marker, 1)
          text = text.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")'
          )

          if 'signingConfig = signingConfigs.getByName("release")' not in text:
              raise SystemExit("Release-Signierung konnte nicht aktiviert werden.")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Keystore-Zugangsdaten getrennt prüfen
        working-directory: app/dart_party_android
        env:
          RELEASE_KEYSTORE: ${{ runner.temp }}/dart-party-release.jks
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Prüfe Keystore und Store-Passwort..."
          keytool -list -keystore "$RELEASE_KEYSTORE" -storepass "$ANDROID_STORE_PASSWORD" >/dev/null
          echo "STORE_OK"
          echo "Prüfe Alias..."
          keytool -list -keystore "$RELEASE_KEYSTORE" -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_STORE_PASSWORD" >/dev/null
          echo "ALIAS_OK"
          echo "Prüfe privates Key-Passwort..."
          keytool -certreq -alias "$ANDROID_KEY_ALIAS" -keystore "$RELEASE_KEYSTORE" -storepass "$ANDROID_STORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" -file "$RUNNER_TEMP/key-check.csr"
          echo "KEY_PASSWORD_OK"

      - name: Gradle-Repositories für Kotlin-Abhängigkeiten ergänzen
        working-directory: app/dart_party_android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/settings.gradle.kts")
          text = path.read_text(encoding="utf-8")
          start = text.find("pluginManagement")
          if start < 0:
              raise SystemExit("pluginManagement-Block fehlt")
          open_brace = text.find("{", start)
          depth = 0
          end = None
          for i in range(open_brace, len(text)):
              if text[i] == "{":
                  depth += 1
              elif text[i] == "}":
                  depth -= 1
                  if depth == 0:
                      end = i
                      break
          if end is None:
              raise SystemExit("pluginManagement-Block ungültig")

          block = text[start:end + 1]
          repo_pos = block.find("repositories")
          if repo_pos < 0:
              insert = block.find("{") + 1
              block = block[:insert] + """
              repositories {
                  maven { url = uri("https://repo.maven.apache.org/maven2") }
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
              """ + block[insert:]
          else:
              repo_open = block.find("{", repo_pos)
              repos_end = None
              depth = 0
              for i in range(repo_open, len(block)):
                  if block[i] == "{":
                      depth += 1
                  elif block[i] == "}":
                      depth -= 1
                      if depth == 0:
                          repos_end = i
                          break
              repos = block[repo_open:repos_end + 1]
              additions = []
              if "https://repo.maven.apache.org/maven2" not in repos:
                  additions.append('maven { url = uri("https://repo.maven.apache.org/maven2") }')
              if "google()" not in repos:
                  additions.append("google()")
              if "mavenCentral()" not in repos:
                  additions.append("mavenCentral()")
              if "gradlePluginPortal()" not in repos:
                  additions.append("gradlePluginPortal()")
              if additions:
                  block = block[:repo_open + 1] + "\n" + "\\n".join("        " + x for x in additions) + block[repo_open + 1:]

          path.write_text(text[:start] + block + text[end + 1:], encoding="utf-8")
          PY

      - name: Abhängigkeiten installieren
        working-directory: app/dart_party_android
        run: flutter pub get

      - name: Android APK bauen
        working-directory: app/dart_party_android
        env:
          RELEASE_KEYSTORE: ${{ runner.temp }}/dart-party-release.jks
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: flutter build apk --release

      - name: SHA-1 Fingerabdruck anzeigen
        run: |
          APK="app/dart_party_android/build/app/outputs/flutter-apk/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs "$APK"

      - name: APK speichern
        uses: actions/upload-artifact@v4
        with:
          name: Dart-Party-Android
          path: app/dart_party_android/build/app/outputs/flutter-apk/app-release.apk
